<!doctype html><html><body style="margin:0;background:#1a1a1a">
<canvas id="c"></canvas>
<script type="module">
/* ------------------------------------------------------------------ *
 *  Atelier d'icônes « Layjou Games » — une composition 1024×1024 par
 *  jeu, rendue avec le moteur vectoriel du projet.
 *    ?game=battle|bubble|puzzle|run
 *    &kind=icon | fg | bg (calques adaptatifs Android) | splash | splash-dark | feature | sheet
 *    &size=1024
 * ------------------------------------------------------------------ */
import '@fontsource-variable/fredoka';
import { drawLayjou, poseOf, heartPath, starPath, hand, resolvePal } from '/src/game/layjou.js';
import { drawMonster } from '/src/game/monsters.js';
import { MONSTER_PALS } from '/src/game/data.js';

const q = new URLSearchParams(location.search);
const game = q.get('game') || 'battle', kind = q.get('kind') || 'icon', size = +(q.get('size') || 1024);
const TAU = Math.PI * 2;
let PX = size; // taille en pixels du canvas en cours de rendu (calques hors écran)

/* ------------------------------ outils ------------------------------ */
const mk = (px = PX) => { const c = document.createElement('canvas'); c.width = c.height = px; return c; };
const lin = (c, x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rad = (c, x, y, r0, r1, stops) => { const g = c.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0.01, r), 0, TAU); };
const FILL = [-600, -600, 2224, 2224]; // déborde : les calques adaptatifs montrent au-delà du cadre

function rays(c, cx, cy, r, n, a0, color, alpha, spread = 0.5) {
  c.save(); c.translate(cx, cy); c.rotate(a0); c.fillStyle = color; c.globalAlpha = alpha;
  const half = (TAU / n) * spread * 0.5;
  for (let i = 0; i < n; i++) { c.rotate(TAU / n); c.beginPath(); c.moveTo(0, 0); c.lineTo(r * Math.cos(half), -r * Math.sin(half)); c.lineTo(r * Math.cos(half), r * Math.sin(half)); c.closePath(); c.fill(); }
  c.restore();
}
function glow(c, x, y, r, color, a = 1) { c.save(); c.globalAlpha = a; c.fillStyle = rad(c, x, y, 0, r, [[0, color], [1, 'rgba(255,255,255,0)']]); circ(c, x, y, r); c.fill(); c.restore(); }
function spark(c, x, y, r, color = '#fff', rot = 0) {
  glow(c, x, y, r * 1.5, 'rgba(255,255,255,0.75)');
  c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = color; starPath(c, 0, 0, r, r * 0.26, 4); c.fill(); c.rotate(Math.PI / 4); starPath(c, 0, 0, r * 0.5, r * 0.16, 4); c.fill(); c.restore();
}
function burstStar(c, x, y, R, r, n, color, rot = 0) { c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = color; starPath(c, 0, 0, R, r, n); c.fill(); c.restore(); }

/**
 * Effet « autocollant » : contour épais + ombre portée autour d'un dessin.
 * Le dessin est rendu dans un calque hors écran pour en extraire la silhouette.
 */
function sticker(c, draw, { outline = 13, color = '#fff', shadow = 'rgba(12,4,40,0.5)', blur = 34, dy = 16, tint = null } = {}) {
  const m = c.getTransform(), k = Math.hypot(m.a, m.b);
  const L = mk(), lc = L.getContext('2d'); lc.setTransform(m); draw(lc);
  if (tint) { lc.setTransform(1, 0, 0, 1, 0, 0); lc.globalCompositeOperation = 'source-atop'; lc.fillStyle = tint; lc.fillRect(0, 0, PX, PX); }
  const Sil = mk(), sc = Sil.getContext('2d'); sc.drawImage(L, 0, 0); sc.globalCompositeOperation = 'source-in'; sc.fillStyle = color; sc.fillRect(0, 0, PX, PX);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  if (shadow) { c.save(); c.shadowColor = shadow; c.shadowBlur = blur * k; c.shadowOffsetY = dy * k; c.drawImage(outline > 0 ? Sil : L, 0, 0); c.restore(); }
  if (outline > 0) { const r = outline * k; for (let i = 0; i < 32; i++) { const a = (i / 32) * TAU; c.drawImage(Sil, Math.cos(a) * r, Math.sin(a) * r); } }
  c.drawImage(L, 0, 0); c.restore();
  return L;
}

function hero(c, o) { // Layjou avec contour autocollant
  sticker(c, (l) => drawLayjou(l, { skin: 'classic', t: 0.5, ...o }), { outline: o.outline ?? 12, blur: 40, dy: 18 });
}
function pose(base, over) { const P = poseOf(base, 0.5, 0.5); P.blink = 0; return Object.assign(P, over); }

/* ------------------------------ bulles ------------------------------ */
const BUB = {
  red: ['#ffc2b8', '#ff4f5e', '#b0103a'], yellow: ['#fff8c2', '#ffcf2e', '#e08600'], green: ['#dcffb8', '#5fd83a', '#1c8a2a'], blue: ['#c6ecff', '#3aa0ff', '#1848c0'],
  purple: ['#ecd2ff', '#a55cff', '#571fb4'], orange: ['#ffe4b0', '#ff9a2e', '#d45400'], pink: ['#ffd6ec', '#ff62a8', '#c01c6c'],
};
function bubble(c, x, y, r, col, { rainbow = false } = {}) {
  const [l, m, d] = BUB[col] || BUB.blue;
  c.save();
  circ(c, x, y, r);
  if (rainbow) {
    const g = c.createConicGradient(-0.6, x, y); ['#ff4f5e', '#ff9a2e', '#ffe14a', '#5fd83a', '#3aa0ff', '#a55cff', '#ff62a8', '#ff4f5e'].forEach((col2, i, a) => g.addColorStop(i / (a.length - 1), col2));
    c.fillStyle = g; c.fill();
    c.fillStyle = rad(c, x - r * 0.3, y - r * 0.35, r * 0.05, r * 1.05, [[0, 'rgba(255,255,255,0.85)'], [0.5, 'rgba(255,255,255,0.12)'], [1, 'rgba(60,20,120,0.28)']]); c.fill();
  } else { c.fillStyle = rad(c, x - r * 0.32, y - r * 0.36, r * 0.05, r * 1.12, [[0, l], [0.42, m], [1, d]]); c.fill(); }
  c.lineCap = 'round';
  c.globalAlpha = 0.4; c.strokeStyle = '#fff'; c.lineWidth = r * 0.075; c.beginPath(); c.arc(x, y, r * 0.84, 0.13 * Math.PI, 0.42 * Math.PI); c.stroke();
  c.globalAlpha = 0.95; c.fillStyle = '#fff'; c.beginPath(); c.ellipse(x - r * 0.37, y - r * 0.43, r * 0.3, r * 0.165, -0.66, 0, TAU); c.fill();
  c.globalAlpha = 0.85; circ(c, x - r * 0.63, y - r * 0.08, r * 0.075); c.fill();
  c.globalAlpha = 1; c.strokeStyle = rainbow ? 'rgba(90,30,150,0.35)' : d; c.lineWidth = r * 0.045; circ(c, x, y, r - r * 0.022); c.globalAlpha = 0.55; c.stroke();
  c.restore();
}
function heart(c, x, y, s, rot = 0) {
  c.save(); c.translate(x, y); c.rotate(rot);
  heartPath(c, 0, s * 0.1, s * 1.08); c.fillStyle = '#b3145f'; c.fill();
  heartPath(c, 0, 0, s); c.fillStyle = lin(c, 0, -s, 0, s, [[0, '#ff9fc8'], [0.5, '#ff4f9a'], [1, '#e0237a']]); c.fill();
  c.globalAlpha = 0.9; c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-s * 0.48, -s * 0.42, s * 0.26, s * 0.15, -0.7, 0, TAU); c.fill();
  c.restore();
}

/* ------------------------- objets (jeu de tri) ------------------------- */
function donut(c, x, y, r) { // centre
  c.save(); c.translate(x, y);
  const ring = (ro, ri, wob) => { c.beginPath(); for (let i = 0; i <= 60; i++) { const a = (i / 60) * TAU, rr = ro + (wob ? Math.sin(a * 7 + 0.6) * wob : 0); c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr * 0.94); } c.closePath(); c.moveTo(ri, 0); c.ellipse(0, 0, ri, ri * 0.9, 0, 0, TAU, true); };
  c.translate(0, r * 0.07); ring(r, r * 0.3); c.fillStyle = '#b8752e'; c.fill('evenodd'); c.translate(0, -r * 0.07);
  ring(r, r * 0.3); c.fillStyle = rad(c, -r * 0.3, -r * 0.3, r * 0.1, r * 1.2, [[0, '#ffdca0'], [1, '#e0a253']]); c.fill('evenodd');
  ring(r * 0.86, r * 0.36, r * 0.05); c.fillStyle = rad(c, -r * 0.3, -r * 0.35, r * 0.1, r * 1.1, [[0, '#ffa6d2'], [1, '#ff4f9a']]); c.fill('evenodd');
  const sp = ['#fff', '#ffe14a', '#56d6f5', '#7dff5a', '#fff', '#a55cff', '#ffe14a', '#56d6f5', '#fff', '#7dff5a'];
  sp.forEach((col, i) => { const a = i * 0.63 + 0.3, rr = r * (0.53 + (i % 3) * 0.09); c.save(); c.translate(Math.cos(a) * rr, Math.sin(a) * rr * 0.94); c.rotate(a * 2.3); c.fillStyle = col; c.beginPath(); c.roundRect(-r * 0.075, -r * 0.028, r * 0.15, r * 0.056, r * 0.028); c.fill(); c.restore(); });
  c.globalAlpha = 0.6; c.strokeStyle = '#fff'; c.lineWidth = r * 0.07; c.lineCap = 'round'; c.beginPath(); c.arc(0, 0, r * 0.7, Math.PI * 1.12, Math.PI * 1.42); c.stroke();
  c.restore();
}
function can(c, x, y, w, h, rot = 0) { // x centre, y bas
  c.save(); c.translate(x, y); c.rotate(rot);
  c.beginPath(); c.roundRect(-w / 2, -h, w, h, w * 0.16); c.fillStyle = lin(c, -w / 2, 0, w / 2, 0, [[0, '#a80d2a'], [0.22, '#ff5a5a'], [0.5, '#ff4040'], [1, '#9c0b26']]); c.fill();
  c.save(); c.clip();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-w / 2, -h * 0.62); c.bezierCurveTo(-w * 0.2, -h * 0.78, w * 0.15, -h * 0.4, w / 2, -h * 0.58); c.lineTo(w / 2, -h * 0.34); c.bezierCurveTo(w * 0.15, -h * 0.16, -w * 0.2, -h * 0.54, -w / 2, -h * 0.38); c.closePath(); c.fill();
  c.fillStyle = lin(c, 0, -h, 0, -h * 0.9, [[0, '#f4f7ff'], [1, '#aab4cc']]); c.fillRect(-w / 2, -h, w, h * 0.1); c.fillStyle = '#aab4cc'; c.fillRect(-w / 2, -h * 0.07, w, h * 0.07);
  c.globalAlpha = 0.4; c.fillStyle = '#fff'; c.fillRect(-w * 0.3, -h, w * 0.13, h); c.globalAlpha = 1;
  c.restore();
  heartPath(c, w * 0.02, -h * 0.47, w * 0.15); c.fillStyle = '#ff4040'; c.fill();
  c.restore();
}
function bottle(c, x, y, w, h) {
  c.save(); c.translate(x, y);
  c.fillStyle = '#2fae5f'; c.beginPath(); c.roundRect(-w * 0.2, -h, w * 0.4, h * 0.12, w * 0.06); c.fill();
  c.beginPath(); c.moveTo(-w * 0.16, -h * 0.89); c.lineTo(w * 0.16, -h * 0.89); c.bezierCurveTo(w * 0.18, -h * 0.76, w / 2, -h * 0.74, w / 2, -h * 0.6); c.lineTo(w / 2, -h * 0.08); c.quadraticCurveTo(w / 2, 0, w * 0.4, 0); c.lineTo(-w * 0.4, 0); c.quadraticCurveTo(-w / 2, 0, -w / 2, -h * 0.08); c.lineTo(-w / 2, -h * 0.6); c.bezierCurveTo(-w / 2, -h * 0.74, -w * 0.18, -h * 0.76, -w * 0.16, -h * 0.89); c.closePath();
  c.fillStyle = lin(c, -w / 2, 0, w / 2, 0, [[0, '#f07a00'], [0.3, '#ffc24a'], [0.6, '#ffa01f'], [1, '#e06a00']]); c.fill();
  c.save(); c.clip(); c.fillStyle = '#fffaf0'; c.fillRect(-w / 2, -h * 0.52, w, h * 0.3); circ(c, 0, -h * 0.37, w * 0.2); c.fillStyle = '#ff8a1f'; c.fill(); c.fillStyle = '#2fae5f'; c.beginPath(); c.ellipse(w * 0.1, -h * 0.47, w * 0.1, w * 0.05, -0.6, 0, TAU); c.fill();
  c.globalAlpha = 0.45; c.fillStyle = '#fff'; c.fillRect(-w * 0.34, -h, w * 0.12, h); c.restore();
  c.restore();
}
function cupcake(c, x, y, w, h) {
  c.save(); c.translate(x, y);
  c.beginPath(); c.moveTo(-w * 0.42, -h * 0.46); c.lineTo(w * 0.42, -h * 0.46); c.lineTo(w * 0.3, 0); c.lineTo(-w * 0.3, 0); c.closePath(); c.fillStyle = lin(c, 0, -h * 0.46, 0, 0, [[0, '#7fdcff'], [1, '#2a8fe0']]); c.fill();
  c.save(); c.clip(); c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = w * 0.045; for (let i = -4; i <= 4; i++) { c.beginPath(); c.moveTo(i * w * 0.105, -h * 0.46); c.lineTo(i * w * 0.075, 0); c.stroke(); } c.restore();
  const layers = [[0, -h * 0.5, w * 0.5, h * 0.17], [0, -h * 0.66, w * 0.38, h * 0.15], [0, -h * 0.8, w * 0.24, h * 0.12]];
  for (const [lx, ly, rx, ry] of layers) { c.beginPath(); c.ellipse(lx, ly, rx, ry, 0, 0, TAU); c.fillStyle = lin(c, 0, ly - ry, 0, ly + ry, [[0, '#fffdf5'], [1, '#ffd0e2']]); c.fill(); }
  circ(c, 0, -h * 0.93, w * 0.12); c.fillStyle = rad(c, -w * 0.04, -h * 0.96, 1, w * 0.14, [[0, '#ff9aa8'], [1, '#e0183f']]); c.fill();
  c.restore();
}
function milk(c, x, y, w, h) {
  c.save(); c.translate(x, y);
  c.beginPath(); c.moveTo(-w / 2, -h * 0.74); c.lineTo(-w * 0.12, -h); c.lineTo(w * 0.12, -h); c.lineTo(w / 2, -h * 0.74); c.closePath(); c.fillStyle = '#cfe6ff'; c.fill();
  c.fillStyle = '#56b8ff'; c.fillRect(-w * 0.14, -h * 1.03, w * 0.28, h * 0.06);
  c.beginPath(); c.roundRect(-w / 2, -h * 0.74, w, h * 0.74, w * 0.06); c.fillStyle = lin(c, -w / 2, 0, w / 2, 0, [[0, '#e8f2ff'], [0.4, '#ffffff'], [1, '#c9dcf5']]); c.fill();
  c.fillStyle = '#3aa0ff'; c.fillRect(-w / 2, -h * 0.5, w, h * 0.3);
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(0, -h * 0.46); c.bezierCurveTo(w * 0.2, -h * 0.34, w * 0.14, -h * 0.24, 0, -h * 0.24); c.bezierCurveTo(-w * 0.14, -h * 0.24, -w * 0.2, -h * 0.34, 0, -h * 0.46); c.fill();
  c.restore();
}
function shelf(c, y) {
  c.save();
  c.fillStyle = lin(c, 0, y + 46, 0, y + 150, [[0, 'rgba(30,8,80,0.42)'], [1, 'rgba(30,8,80,0)']]); c.fillRect(-600, y + 46, 2224, 104);
  c.fillStyle = lin(c, 0, y, 0, y + 20, [[0, '#ffe7b8'], [1, '#f6bd72']]); c.fillRect(-600, y, 2224, 20);
  c.fillStyle = lin(c, 0, y + 20, 0, y + 50, [[0, '#e9a455'], [1, '#bd7430']]); c.fillRect(-600, y + 20, 2224, 30);
  c.fillStyle = 'rgba(255,255,255,0.55)'; c.fillRect(-600, y, 2224, 4);
  c.restore();
}

/* =============================== BATTLE =============================== */
const MON = q.get('m') || 'dragon', MPAL = q.get('mp') || 'glitch';
const battle = {
  word: 'BATTLE', splash: '#3a0a34', splashDark: '#1e0520', accent: ['#ff7a2f', '#d81e4a'],
  bg(c) {
    const cx = 700, cy = 640;
    c.fillStyle = rad(c, cx, cy, 20, 1150, [[0, '#fff7cf'], [0.1, '#ffd84a'], [0.27, '#ff8a2f'], [0.5, '#e0244a'], [0.76, '#74104f'], [1, '#2a0834']]); c.fillRect(...FILL);
    rays(c, cx, cy, 2200, 16, 0.2, '#fff', 0.12, 0.42);
    rays(c, cx, cy, 2200, 8, 0.52, '#ffe9a8', 0.09, 0.3);
  },
  fg(c) {
    // le monstre géant domine la scène
    const mon = MON === 'blob'
      ? { type: 'blob', x: 850, y: 960, scale: 4.1, pal: MONSTER_PALS.grape, t: 0.4, wind: 0.55, strike: 0, kind: 'slam', enraged: true }
      : { type: 'dragon', x: 968, y: 1090, scale: 3.45, pal: MONSTER_PALS[MPAL], t: 0.4, wind: 1, strike: 0, kind: 'swipe', enraged: true };
    const fx = 716, fy = 792;
    glow(c, fx, fy, 330, 'rgba(255,255,255,0.9)');
    sticker(c, (l) => drawMonster(l, mon.type, mon), { outline: 9, color: '#fff3c2', shadow: 'rgba(40,0,30,0.6)', blur: 36, dy: 14 });
    // impact du coup de poing
    glow(c, fx, fy, 170, 'rgba(255,255,255,0.85)');
    burstStar(c, fx, fy, 262, 118, 14, '#fff', 0.1); burstStar(c, fx, fy, 196, 92, 14, '#ffe14a', 0.34);
    // héros
    const s = 4.2, hx0 = 322, hy0 = 1190;
    hero(c, { x: hx0, y: hy0, scale: s, pose: pose('idle', { turn: 0.5, lean: 0.13, headTilt: -0.05, bob: 0, hfx: (fx - hx0) / s, hfy: (fy - hy0) / s, bendF: 10, fistF: 1, hsF: 2.15, hbx: -46, hby: -50, bendB: -12, fistB: 1, hsB: 1.05, eyes: 'angry', mouth: 'open', lookX: 0.9, lookY: -0.2, weaponOn: 0, glow: 0.6 }) });
    for (const [x, y, r, rot] of [[905, 640, 30, 0.3], [860, 930, 26, 0.6], [150, 300, 20, 0], [330, 150, 14, 0.4], [590, 960, 16, 0.4], [520, 330, 16, 0.2]]) spark(c, x, y, r, '#fff', rot);
  },
};

/* =============================== BUBBLE =============================== */
const bubbleGame = {
  word: 'BUBBLE', splash: '#1c6fd6', splashDark: '#0c2f78', accent: ['#39e4ff', '#3a5be0'],
  bg(c) {
    c.fillStyle = lin(c, 0, -100, 0, 1124, [[0, '#6ff3ff'], [0.42, '#2fb0ff'], [1, '#3a4fd8']]); c.fillRect(...FILL);
    rays(c, 512, -260, 2200, 22, 0.05, '#fff', 0.09, 0.38);
    for (const [x, y, r, a] of [[180, 700, 90, 0.1], [860, 760, 120, 0.09], [640, 560, 60, 0.1], [330, 420, 44, 0.12], [760, 400, 36, 0.12]]) { c.globalAlpha = a; circ(c, x, y, r); c.fillStyle = '#fff'; c.fill(); c.globalAlpha = 1; }
  },
  fg(c) {
    // trio aligné qui s'illumine
    const trio = [[262, 204], [512, 146], [762, 204]];
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
    for (const [w, col] of [[306, 'rgba(255,255,255,0.24)'], [254, 'rgba(255,250,190,0.55)']]) { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(...trio[0]); c.quadraticCurveTo(512, 88, ...trio[2]); c.stroke(); }
    c.restore();
    bubble(c, 58, 384, 110, 'purple'); bubble(c, 966, 384, 110, 'green');
    for (const [x, y] of trio) bubble(c, x, y, 116, 'yellow');
    bubble(c, 30, 624, 98, 'red'); bubble(c, 994, 624, 98, 'orange');
    for (const [x, y, r, rot] of [[390, 156, 34, 0.2], [640, 126, 28, 0.5], [150, 122, 22, 0], [880, 100, 26, 0.3]]) spark(c, x, y, r, '#fff', rot);
    // héros
    hero(c, { x: 512, y: 1168, scale: 4.25, pose: pose('victory', { rootY: 0, squash: 0, turn: 0, headTilt: -0.05, hfx: 74, hfy: -116, hbx: -74, hby: -114, bendF: -8, bendB: 8, ffx: 16, ffy: 0, fbx: -16, fby: 0, eyes: 'open', mouth: 'open', lookY: -0.5, glow: 0.4 }) });
    // bulles au premier plan
    bubble(c, 90, 912, 142, 'blue'); bubble(c, 934, 912, 142, 'pink');
    bubble(c, 290, 1010, 126, 'green'); bubble(c, 734, 1010, 126, 'purple');
    spark(c, 196, 776, 26, '#fff', 0.2); spark(c, 836, 768, 22, '#fff', 0.5);
  },
};

/* =============================== PUZZLE =============================== */
const puzzle = {
  word: 'PUZZLE', splash: '#6a3ad6', splashDark: '#2c1470', accent: ['#b78cff', '#5b2fd0'],
  bg(c) {
    c.fillStyle = lin(c, 0, -100, 0, 1124, [[0, '#b48cff'], [0.5, '#8356f0'], [1, '#5226c4']]); c.fillRect(...FILL);
    c.save(); c.globalAlpha = 0.07; c.strokeStyle = '#fff'; c.lineWidth = 34; for (let i = -30; i < 40; i++) { c.beginPath(); c.moveTo(i * 96, -600); c.lineTo(i * 96 + 900, 1700); c.stroke(); } c.restore();
    glow(c, 512, 300, 620, 'rgba(255,255,255,0.3)');
  },
  fg(c) {
    const y1 = 398, y2 = 742;
    const it = (fn) => sticker(c, fn, { outline: 7, blur: 16, dy: 8, shadow: 'rgba(40,10,90,0.4)' });
    // étagère du haut : le trio identique s'illumine
    const xs = [246, 512, 778], dy = y1 - 112;
    c.save(); c.beginPath(); c.rect(-600, -600, 2224, 600 + y1); c.clip(); c.beginPath(); c.roundRect(xs[0] - 152, dy - 146, xs[2] - xs[0] + 304, 330, 146); c.fillStyle = 'rgba(255,244,170,0.3)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,0.92)'; c.lineWidth = 9; c.setLineDash([34, 22]); c.lineCap = 'round'; c.stroke(); c.restore();

/* ------------------------------ rendus ------------------------------ */
function vignette(c) { c.save(); c.fillStyle = rad(c, 512, 500, 420, 900, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(10,0,40,0.3)']]); c.fillRect(...FILL); c.restore(); }

/** Icône complète dans un canvas de `px` pixels. Les calques adaptatifs sont rendus plein cadre : capacitor-assets ajoute lui-même la marge de sécurité. */
function render(g, px, layer = 'all', k = 1) {
  const prev = PX; PX = px;
  const cv = mk(px), c = cv.getContext('2d'), S = px / 1024;
  c.setTransform(S * k, 0, 0, S * k, S * 512 * (1 - k), S * 512 * (1 - k));
  if (layer !== 'fg') { g.bg(c); vignette(c); }
  if (layer !== 'bg') g.fg(c);
  PX = prev; return cv;
}

function wordmark(c, cx, cy, k, word, colors) {
  c.save(); c.textBaseline = 'middle'; c.lineJoin = 'round';

  const lw = 560 * k, lh = lw * LOGO.height / LOGO.width;

  c.fillStyle = lin(c, -bw / 2, 0, bw / 2, 0, [[0, colors[0]], [1, colors[1]]]); c.beginPath(); c.roundRect(-bw / 2, -32 * k, bw, 64 * k, 20 * k); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 4 * k; c.stroke();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = `700 ${44 * k}px "Fredoka Variable"`;
  for (let i = 0; i < word.length; i++) c.fillText(word[i], (i - (word.length - 1) / 2) * sp, 2 * k);
  c.restore();
}

function roundedIcon(c, g, x, y, s, radius = 0.225) { // icône masquée façon lanceur
  const ic = render(g, Math.round(s * (c.getTransform().a || 1)));

}
