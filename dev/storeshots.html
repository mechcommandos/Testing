<!doctype html><html><body style="margin:0;background:#111">
<canvas id="c"></canvas>
<script type="module">
/* Mise en page des captures pour les stores : légende + capture dans un cadre de téléphone.
   Appelé par tools/render-storeshots.cjs via window.compose(...). */
import '@fontsource-variable/fredoka';
await document.fonts.load('700 100px "Fredoka Variable"');
await document.fonts.load('500 100px "Fredoka Variable"');

const TAU = Math.PI * 2;
const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

function wrap(c, text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

/**
 * @param {{w:number,h:number,shot:string,icon:string,title:string,sub:string,c1:string,c2:string,c3:string,name:string}} o
 */
window.compose = async (o) => {
  const cv = document.getElementById('c'); cv.width = o.w; cv.height = o.h;
  const c = cv.getContext('2d'), W = o.w, H = o.h, k = W / 1080;
  const [shot, icon] = await Promise.all([load(o.shot), load(o.icon)]);
  // fond : dégradé + rayons + bulles
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, o.c1); g.addColorStop(0.55, o.c2); g.addColorStop(1, o.c3);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.translate(W / 2, H * 0.16); c.fillStyle = '#fff'; c.globalAlpha = 0.08;
  for (let i = 0; i < 18; i++) { c.rotate(TAU / 18); c.beginPath(); c.moveTo(0, 0); c.lineTo(H, -H * 0.09); c.lineTo(H, H * 0.09); c.closePath(); c.fill(); }
  c.restore();
  c.fillStyle = 'rgba(255,255,255,0.1)'; for (const [x, y, r] of [[0.08, 0.3, 90], [0.92, 0.24, 60], [0.9, 0.82, 130], [0.06, 0.9, 110]]) { c.beginPath(); c.arc(W * x, H * y, r * k, 0, TAU); c.fill(); }
  // pastille du jeu
  const ih = 92 * k, top = 64 * k;
  c.font = `700 ${40 * k}px "Fredoka Variable"`; const nw = c.measureText(o.name).width, pw = ih + 26 * k + nw + 40 * k, px = (W - pw) / 2;
  c.fillStyle = 'rgba(10,6,40,0.28)'; c.beginPath(); c.roundRect(px, top, pw, ih + 20 * k, (ih + 20 * k) / 2); c.fill();
  c.save(); c.beginPath(); c.roundRect(px + 10 * k, top + 10 * k, ih, ih, ih * 0.24); c.clip(); c.drawImage(icon, px + 10 * k, top + 10 * k, ih, ih); c.restore();
  c.fillStyle = '#fff'; c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillText(o.name, px + ih + 30 * k, top + 10 * k + ih / 2 + 2 * k);
  // légende
  const tTop = top + ih + 70 * k;
  c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.lineJoin = 'round';
  c.font = `700 ${86 * k}px "Fredoka Variable"`;
  const lines = wrap(c, o.title, W - 120 * k);
  lines.forEach((ln, i) => {
    const y = tTop + 86 * k + i * 96 * k;
    c.lineWidth = 16 * k; c.strokeStyle = 'rgba(20,6,60,0.35)'; c.strokeText(ln, W / 2, y + 6 * k);
    c.fillStyle = '#fff'; c.fillText(ln, W / 2, y);
  });
  let y = tTop + 86 * k + (lines.length - 1) * 96 * k + 70 * k;
  if (o.sub) {
    c.font = `500 ${44 * k}px "Fredoka Variable"`; c.fillStyle = 'rgba(255,255,255,0.94)';
    for (const ln of wrap(c, o.sub, W - 160 * k)) { c.fillText(ln, W / 2, y); y += 54 * k; }
  }
  // téléphone
  const avail = H - y - 40 * k;
  const ratio = shot.height / shot.width;
  let pw2 = W * 0.74, ph2 = pw2 * ratio + 0;
  const bez = 22 * k;
  if (ph2 + bez * 2 > avail + H * 0.02) { ph2 = avail + H * 0.02 - bez * 2; pw2 = ph2 / ratio; } // téléphone entier, légèrement rogné en bas au plus
  const fx = (W - pw2) / 2 - bez, fy = y + 34 * k;
  const R = 92 * k;
  c.save(); c.shadowColor = 'rgba(10,0,40,0.45)'; c.shadowBlur = 60 * k; c.shadowOffsetY = 26 * k;
  c.fillStyle = '#141230'; c.beginPath(); c.roundRect(fx, fy, pw2 + bez * 2, ph2 + bez * 2, R); c.fill(); c.restore();
  c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 4 * k; c.beginPath(); c.roundRect(fx + 2 * k, fy + 2 * k, pw2 + bez * 2 - 4 * k, ph2 + bez * 2 - 4 * k, R - 2 * k); c.stroke();
  c.save(); c.beginPath(); c.roundRect(fx + bez, fy + bez, pw2, ph2, R - bez); c.clip(); c.drawImage(shot, fx + bez, fy + bez, pw2, ph2); c.restore();
  return cv.toDataURL('image/png');
};
document.title = 'ready';
</script></body></html>
