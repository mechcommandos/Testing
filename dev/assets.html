<!doctype html><html><body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script type="module">
// Rendu des visuels de l'app (icône, premier plan adaptatif, fond, splash) à partir du moteur vectoriel du jeu.
import '@fontsource-variable/fredoka';
import { drawLayjou, poseOf, heartPath, starPath } from '/src/game/layjou.js';
const q = new URLSearchParams(location.search), kind = q.get('kind') || 'icon', size = +(q.get('size') || 1024);
const cv = document.getElementById('c'); cv.width = cv.height = size; const ctx = cv.getContext('2d'); const S = size / 1024; ctx.scale(S, S);
const TAU = Math.PI * 2;
function bg(dark) {
  const g = ctx.createRadialGradient(512, 400, 40, 512, 512, 780); g.addColorStop(0, dark ? '#1b2a86' : '#3550d8'); g.addColorStop(0.55, dark ? '#101a5c' : '#1b2a8f'); g.addColorStop(1, dark ? '#060a2a' : '#0b1440');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
  for (const [x, y, r, c] of [[130, 220, 380, 'rgba(28,195,210,0.5)'], [900, 800, 420, 'rgba(255,92,157,0.42)'], [520, 1040, 360, 'rgba(143,91,255,0.4)']]) { const o = ctx.createRadialGradient(x, y, 0, x, y, r); o.addColorStop(0, c); o.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = o; ctx.fillRect(0, 0, 1024, 1024); }
}
function rays(cx, cy, r, a) { ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = `rgba(255,255,255,${a})`; for (let i = 0; i < 14; i++) { ctx.rotate(TAU / 14); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r, -r * 0.1); ctx.lineTo(r, r * 0.1); ctx.closePath(); ctx.fill(); } ctx.restore(); }
function hero(x, y, sc, pose = 'icon') {
  const P = poseOf('idle', 0.5, 0); P.turn = 0.18; P.lean = 0.03; P.headTilt = -0.07; P.eyes = 'open'; P.mouth = 'open'; P.blink = 0; P.lookX = 0.3;
  P.hfx = 62; P.hfy = -118; P.fistF = 1; P.bendF = 12; P.hbx = -44; P.hby = -56; P.fistB = 1; P.weaponOn = 0; P.glow = 0.5;
  if (pose === 'wave') Object.assign(P, poseOf('wave', 0.6, 0), { blink: 0 });
  drawLayjou(ctx, { x, y, scale: sc, pose: P, skin: 'classic', t: 0.5 });
}
function sparkles(list) { for (const [x, y, r, c] of list) { ctx.fillStyle = c; starPath(ctx, x, y, r, r * 0.38, 4); ctx.fill(); } }
function logo(cx, cy, k) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = `700 ${150 * k}px "Fredoka Variable"`;
  const w1 = ctx.measureText('Lay').width, w2 = ctx.measureText('J').width, w3 = ctx.measureText('ou').width, x0 = cx - (w1 + w2 + w3) / 2;
  ctx.textAlign = 'left';
  for (const [dy, c1, c2] of [[16 * k, '#0c5f8f', '#9c1a5b'], [8 * k, '#1fb9cf', '#ff3f8a'], [0, '#ffffff', '#ff9cc4']]) { ctx.fillStyle = c1; ctx.fillText('Lay', x0, cy + dy); ctx.fillText('ou', x0 + w1 + w2, cy + dy); ctx.fillStyle = c2; ctx.fillText('J', x0 + w1, cy + dy); }
  ctx.save(); ctx.translate(cx, cy + 112 * k); ctx.rotate(-0.035);
  const g = ctx.createLinearGradient(-170 * k, 0, 170 * k, 0); g.addColorStop(0, '#ff5c9d'); g.addColorStop(1, '#c44dff');
  ctx.fillStyle = '#7a1f9c'; ctx.beginPath(); ctx.roundRect(-170 * k, -24 * k, 340 * k, 62 * k, 20 * k); ctx.fill();
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-170 * k, -32 * k, 340 * k, 62 * k, 20 * k); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = `700 ${42 * k}px "Fredoka Variable"`;
  const txt = 'BATTLE', sp = 44 * k; for (let i = 0; i < txt.length; i++) ctx.fillText(txt[i], (i - (txt.length - 1) / 2) * sp, 1 * k);
  ctx.restore();
}
await document.fonts.load('700 100px "Fredoka Variable"');
if (kind === 'icon') { // icône complète (iOS + legacy Android)
  bg(false); rays(512, 520, 900, 0.07);
  sparkles([[150, 180, 46, '#ffe27a'], [880, 250, 34, '#a8f3ff'], [120, 760, 30, '#ff9cc4'], [900, 700, 24, '#fff']]);
  hero(490, 1150, 5.5);
} else if (kind === 'fg') { // premier plan adaptatif : tout doit tenir dans le cercle central (66 %)
  hero(500, 836, 2.9);
} else if (kind === 'bg') { bg(false); rays(512, 520, 900, 0.07); }
else if (kind === 'stat') { // icône de notification monochrome (silhouette blanche)
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(232, 300, 560, 480, 190); ctx.fill();
  ctx.beginPath(); ctx.arc(512, 170, 62, 0, TAU); ctx.fill(); ctx.fillRect(494, 200, 36, 110);
  ctx.beginPath(); ctx.arc(200, 560, 74, 0, TAU); ctx.arc(824, 560, 74, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.roundRect(300, 380, 424, 320, 130); ctx.fill();
  ctx.globalCompositeOperation = 'source-over'; ctx.beginPath(); ctx.arc(420, 520, 44, 0, TAU); ctx.arc(604, 520, 44, 0, TAU); ctx.fill();
  ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(512, 590, 60, 0.25, Math.PI - 0.25); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(372, 800, 280, 150, 70); ctx.fill();
} else { // splash : contenu concentré au centre (les bords sont rognés selon l'écran)
  // fond uni : identique à la couleur de fenêtre native, et PNG très légers
  ctx.fillStyle = kind === 'splash-dark' ? '#060a2a' : '#0b1440'; ctx.fillRect(0, 0, 1024, 1024);
  hero(512, 560, 1.28, 'wave'); logo(512, 640, 0.62);
  sparkles([[372, 330, 14, '#ffe27a'], [668, 372, 11, '#a8f3ff'], [352, 520, 9, '#ff9cc4']]);
}
document.title = 'ready';
</script></body></html>
