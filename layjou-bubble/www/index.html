<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#E6F4FB">
  <title>Layjou Bubble</title>
  <link rel="icon" href="img/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <!-- Home -->
  <section id="home" class="screen active">
    <h1 class="logo"><img src="img/layjou-logo.png" alt="Layjou"><em>Bubble</em></h1>
    <img class="mascot hero" src="img/layjou.png" alt="Layjou">
    <button class="btn primary big" id="btnPlay"></button>
    <button class="btn" id="btnLevels"></button>
    <button class="btn ghost" id="btnSound"></button>
      <button class="btn ghost" id="btnVibe"></button>
  </section>

  <!-- Level select -->
  <section id="map" class="screen">
    <header class="bar">
      <button class="icon-btn" data-go="home" aria-label="Retour">‹</button>
      <h2 id="mapTitle"></h2>
      <div class="total-stars"><span>★</span><b id="totalStars">0</b></div>
    </header>
    <div class="levels" id="levels"></div>
  </section>

  <!-- Game -->
  <section id="game" class="screen">
    <header class="hud">
      <button class="icon-btn" id="btnPause" aria-label="Pause">❚❚</button>
      <div class="hud-box moves"><small id="lblMoves"></small><b id="moves">0</b></div>
      <div class="hud-box goal"><small id="lblGoal"></small><b id="goal"></b></div>
      <div class="hud-box score"><small id="lblScore"></small><b id="score">0</b></div>
    </header>
    <div class="progress">
      <div class="progress-fill" id="starBar"></div>
      <span class="pstar" id="ps0">★</span><span class="pstar" id="ps1">★</span><span class="pstar" id="ps2">★</span>
    </div>
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board"></div>
    </div>
    <footer class="coach">
      <img class="mascot small" id="coach" src="img/layjou.png" alt="">
      <div class="speech" id="speech"></div>
    </footer>
  </section>

  <!-- Modal -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <!-- Simulated ad (browser preview only) -->
  <div class="fake-ad" id="fakeAd">
    <p id="fakeAdText"></p>
    <b id="fakeAdCount"></b>
  </div>

  <script src="vendor/capacitor.js"></script>
  <script src="js/config.js"></script>
  <script src="js/haptique.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
